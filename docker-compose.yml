version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: waykanan_postgres
    restart: always
    environment:
      POSTGRES_USER: waykanan
      POSTGRES_PASSWORD: waykanan_password
      POSTGRES_DB: waykanan_agro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
